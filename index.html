<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A new experience is launching soon. Sign up to be the first to know.">
    <title>Launching Soon</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #0b1020;
            --card: rgba(19, 28, 55, 0.82);
            --text: #f8fafc;
            --muted: #aab6d3;
            --accent: #8b5cf6;
            --accent-light: #c4b5fd;
            --border: rgba(196, 181, 253, 0.2);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, #1e1b4b 0, transparent 38%),
                        radial-gradient(circle at 80% 80%, #312e81 0, transparent 35%), var(--background);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 560px);
            padding: clamp(32px, 8vw, 64px) clamp(24px, 7vw, 56px);
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--card);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
            backdrop-filter: blur(16px);
        }

        .badge {
            display: inline-block;
            margin-bottom: 22px;
            padding: 7px 14px;
            border: 1px solid rgba(196, 181, 253, 0.35);
            border-radius: 999px;
            color: var(--accent-light);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            line-height: 1.05;
            letter-spacing: -0.05em;
        }

        p {
            margin: 20px 0 30px;
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.65;
        }

        form {
            display: flex;
            gap: 10px;
            margin: 0 auto;
        }

        input, button {
            min-height: 50px;
            border-radius: 10px;
            font: inherit;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 0 15px;
            border: 1px solid rgba(170, 182, 211, 0.3);
            outline: none;
            background: rgba(7, 12, 28, 0.72);
            color: var(--text);
        }

        input::placeholder { color: #7e8baa; }
        input:focus { border-color: var(--accent-light); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22); }

        button {
            padding: 0 19px;
            border: 0;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: white;
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover { filter: brightness(1.12); transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        #message { min-height: 24px; margin: 14px 0 0; color: var(--accent-light); font-size: 0.9rem; }
        .fine-print { margin: 16px 0 0; color: #7e8baa; font-size: 0.78rem; }

        @media (max-width: 480px) {
            form { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <div class="badge">Something new is coming</div>
        <h1>Launching Soon</h1>
        <p>We’re putting the finishing touches on something special. Join the list and be the first to receive an update.</p>

        <form id="updates-form">
            <label for="email" hidden>Email address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
            <button type="submit">Notify me</button>
        </form>
        <div id="message" role="status" aria-live="polite"></div>
        <p class="fine-print">No spam. Just one email when we launch.</p>
    </main>

    <script>
        document.getElementById('updates-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            document.getElementById('message').textContent = `Thanks! We’ll keep ${email} posted.`;
            this.reset();
        });
    </script>
</body>
</html>
